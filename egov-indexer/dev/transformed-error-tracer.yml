ServiceMaps:
  serviceName: project
  version: 1.0.0
  mappings:
  - topic: dev-transformed-errors-topic
    configKey: INDEX
    indexes:
    - name: dev-transformed-errors-index-v1
      type: errors
      id: $.id
      isBulk: true
      jsonPath: $
      customJsonMapping:
        indexMapping:
          Data: {}
        fieldMapping:
        - inJsonPath: $
          outJsonPath: $.Data
      timeStampField: $.auditDetails.createdTime
