ServiceMaps:
  serviceName: attendance-service
  version: 1.0.0
  mappings:
  - topic: dev-save-attendance
    configKey: INDEX
    indexes:
    - name: dev-attendance-index-v1
      type: attendance
      id: $.id
      isBulk: true
      jsonPath: $.*
      timeStampField: $.auditDetails.createdTime
  - topic: dev-update-attendance
    configKey: INDEX
    indexes:
    - name: dev-attendance-index-v1
      type: attendance
      id: $.id
      isBulk: true
      jsonPath: $.*
      timeStampField: $.auditDetails.lastModifiedTime
  - topic: dev-save-attendee
    configKey: INDEX
    indexes:
    - name: dev-attendee-index-v1
      type: attendee
      id: $.id
      isBulk: true
      jsonPath: $.*
      timeStampField: $.auditDetails.createdTime
  - topic: dev-update-attendee
    configKey: INDEX
    indexes:
    - name: dev-attendee-index-v1
      type: attendee
      id: $.id
      isBulk: true
      jsonPath: $.*
      timeStampField: $.auditDetails.lastModifiedTime
  - topic: dev-save-staff
    configKey: INDEX
    indexes:
    - name: dev-staff-index-v1
      type: staff
      id: $.id
      isBulk: true
      jsonPath: $.*
      timeStampField: $.auditDetails.createdTime
  - topic: dev-update-staff
    configKey: INDEX
    indexes:
    - name: dev-staff-index-v1
      type: staff
      id: $.id
      isBulk: true
      jsonPath: $.*
      timeStampField: $.auditDetails.lastModifiedTime
  - topic: dev-transformer-save-attendance-register
    configKey: INDEX
    indexes:
    - name: dev-transformed-attendance-register-index-v1
      type: attendance-register
      id: $.attendanceRegister.id
      isBulk: true
      jsonPath: $.*
      timeStampField: $.attendanceRegister.auditDetails.lastModifiedTime
  - topic: dev-transformer-save-attendance-log
    configKey: INDEX
    indexes:
    - name: dev-attendance-log-index-v1
      type: attendance-log
      id: $.attendanceLog.id
      isBulk: true
      jsonPath: $.*
      timeStampField: $.attendanceLog.auditDetails.lastModifiedTime
  - topic: dev-update-attendance-log
    configKey: INDEX
    indexes:
    - name: dev-attendance-log-index-v1
      type: attendance-log
      id: $.id
      isBulk: true
      jsonPath: $.*
      timeStampField: $.time
