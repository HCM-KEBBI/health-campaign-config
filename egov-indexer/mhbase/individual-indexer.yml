ServiceMaps:
  serviceName: individual
  version: 1.0.0
  mappings:
    - topic: mhbase-save-individual-topic
      configKey: INDEX
      indexes:
        - name: mhbase-individual-index-v1
          type: individual
          id: $.clientReferenceId
          isBulk: true
          jsonPath: $.*
          timeStampField: $.auditDetails.createdTime
    - topic: mhbase-update-individual-topic
      configKey: INDEX
      indexes:
        - name: mhbase-individual-index-v1
          type: individual
          id: $.clientReferenceId
          isBulk: true
          jsonPath: $.*
          timeStampField: $.auditDetails.lastModifiedTime
    - topic: mhbase-delete-individual-topic
      configKey: INDEX
      indexes:
        - name: mhbase-individual-index-v1
          type: individual
          id: $.clientReferenceId
          isBulk: true
          jsonPath: $.*
          timeStampField: $.auditDetails.lastModifiedTime
