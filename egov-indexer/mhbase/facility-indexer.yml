ServiceMaps:
  serviceName: facility
  version: 1.0.0
  mappings:
    - topic: mhbase-save-facility-topic
      configKey: INDEX
      indexes:
        - name: mhbase-facility-index-v1
          type: facility
          id: $.clientReferenceId
          isBulk: true
          jsonPath: $.*
          timeStampField: $.auditDetails.createdTime
    - topic: mhbase-update-facility-topic
      configKey: INDEX
      indexes:
        - name: mhbase-facility-index-v1
          type: facility
          id: $.clientReferenceId
          isBulk: true
          jsonPath: $.*
          timeStampField: $.auditDetails.lastModifiedTime
