ServiceMaps:
  serviceName: Uploader
  version: 1.0.0
  mappings:
    - topic: azmbase-save-upload-jobs
      configKey: INDEX
      indexes:
        - name: azmbase-uploaderindex-v1
          type: jobs
          id: $.code
          isBulk: false
          jsonPath: $.UploadJob
          timeStampField: $.auditDetails.createdTime
    - topic: azmbase-update-upload-jobs
      configKey: INDEX
      indexes:
        - name: azmbase-uploaderindex-v1
          type: jobs
          id: $.code
          isBulk: false
          jsonPath: $.UploadJob
          timeStampField: $.auditDetails.createdTime
