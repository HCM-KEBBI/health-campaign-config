ServiceMaps:
  serviceName: facility
  version: 1.0.0
  mappings:
    - topic: azmbase-save-facility-topic
      configKey: INDEX
      indexes:
        - name: azmbase-facility-index-v1
          type: facility
          id: $.clientReferenceId
          isBulk: true
          jsonPath: $.*
          timeStampField: $.auditDetails.createdTime
    - topic: azmbase-update-facility-topic
      configKey: INDEX
      indexes:
        - name: azmbase-facility-index-v1
          type: facility
          id: $.clientReferenceId
          isBulk: true
          jsonPath: $.*
          timeStampField: $.auditDetails.lastModifiedTime
