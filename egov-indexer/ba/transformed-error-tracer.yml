ServiceMaps:
  serviceName: project
  version: 1.0.0
  mappings:
  - topic: ba-transformed-errors-topic
    configKey: INDEX
    indexes:
    - name: ba-transformed-errors-index-v1
      type: errors
      id: $.id
      isBulk: true
      jsonPath: $
      customJsonMapping:
        indexMapping:
          Data: {}
        fieldMapping:
        - inJsonPath: $
          outJsonPath: $.Data
      timeStampField: $.auditDetails.createdTime
      
    - topic: transformer-error-topic
      configKey: INDEX
      indexes:
        - name: transformer-error-index-v1
          type: errors
          id: $.id
          isBulk: false
          jsonPath: $
          timeStampField: $.timestamp      
