ServiceMaps:
  serviceName: stock
  version: 1.0.0
  mappings:
  - topic: ba-transformer-producer-bulk-stock-index-v1-topic
    configKey: INDEX
    indexes:
    - name: ba-stock-index-v1
      type: stock
      id: $.clientReferenceId,$.tenantId
      isBulk: true
      jsonPath: $
      customJsonMapping:
        indexMapping:
          Data: {}
        fieldMapping:
        - inJsonPath: $
          outJsonPath: $.Data
      timeStampField: $.createdTime
    - name: ba-user-sync-index-v1
      type: users
      id: $.id,$.tenantId,$.clientReferenceId
      isBulk: true
      jsonPath: $
      customJsonMapping:
        indexMapping:
          Data: { additionalDetails: {} }
        fieldMapping:
        - inJsonPath: $.id
          outJsonPath: $.Data.stockId
        - inJsonPath: $.createdBy
          outJsonPath: $.Data.syncedUserId
        - inJsonPath: $.userName
          outJsonPath: $.Data.syncedUserName
        - inJsonPath: $.role
          outJsonPath: $.Data.role
        - inJsonPath: $.boundaryHierarchy
          outJsonPath: $.Data.boundaryHierarchy
        - inJsonPath: $.createdTime
          outJsonPath: $.Data.clientCreatedTime
        - inJsonPath: $.syncedTime
          outJsonPath: $.Data.createdTime
        - inJsonPath: $.syncedTimeStamp
          outJsonPath: $.Data.syncedTimeStamp
        - inJsonPath: $.@timestamp
          outJsonPath: $.Data.@timestamp
        - inJsonPath: $.taskDates
          outJsonPath: $.Data.taskDates
        - inJsonPath: $.syncedDate
          outJsonPath: $.Data.syncedDate
        - inJsonPath: $.campaignNumber
          outJsonPath: $.Data.campaignNumber
        - inJsonPath: $.campaignId
          outJsonPath: $.Data.campaignId
        - inJsonPath: $.additionalDetails.cycleIndex
          outJsonPath: $.Data.additionalDetails.cycleIndex
      timeStampField: $.createdTime
  - topic: ba-transformer-producer-stock-recon-index-v1-topic
    configKey: INDEX
    indexes:
    - name: ba-stock-reconciliation-index-v1
      type: reconciliation
      id: $.stockReconciliation.id
      isBulk: true
      jsonPath: $
      customJsonMapping:
        indexMapping:
          Data: {}
        fieldMapping:
        - inJsonPath: $
          outJsonPath: $.Data
      timeStampField: $.stockReconciliation.auditDetails.createdTime
