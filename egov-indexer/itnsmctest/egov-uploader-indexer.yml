ServiceMaps:
  serviceName: Uploader
  version: 1.0.0
  mappings:
    - topic: itnsmctest-save-upload-jobs
      configKey: INDEX
      indexes:
        - name: itnsmctest-uploaderindex-v1
          type: jobs
          id: $.code
          isBulk: false
          jsonPath: $.UploadJob
          timeStampField: $.auditDetails.createdTime
    - topic: itnsmctest-update-upload-jobs
      configKey: INDEX
      indexes:
        - name: itnsmctest-uploaderindex-v1
          type: jobs
          id: $.code
          isBulk: false
          jsonPath: $.UploadJob
          timeStampField: $.auditDetails.createdTime
