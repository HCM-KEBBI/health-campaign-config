ServiceMaps:
  serviceName: individual
  version: 1.0.0
  mappings:
    - topic: itnsmctest-save-individual-topic
      configKey: INDEX
      indexes:
        - name: itnsmctest-individual-index-v1
          type: individual
          id: $.clientReferenceId
          isBulk: true
          jsonPath: $.*
          timeStampField: $.auditDetails.createdTime
    - topic: itnsmctest-update-individual-topic
      configKey: INDEX
      indexes:
        - name: itnsmctest-individual-index-v1
          type: individual
          id: $.clientReferenceId
          isBulk: true
          jsonPath: $.*
          timeStampField: $.auditDetails.lastModifiedTime
    - topic: itnsmctest-delete-individual-topic
      configKey: INDEX
      indexes:
        - name: itnsmctest-individual-index-v1
          type: individual
          id: $.clientReferenceId
          isBulk: true
          jsonPath: $.*
          timeStampField: $.auditDetails.lastModifiedTime
