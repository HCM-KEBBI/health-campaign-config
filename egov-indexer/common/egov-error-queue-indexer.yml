ServiceMaps:
  serviceName: Tracer
  version: 1.0.0
  mappings:
  - topic: error-details-indexer-topic
    configKey: INDEX
    indexes:
    - name: egov-tracer-error-details
      type: general
      id: $.uuid
      isBulk: true
      jsonPath: $.*
      timeStampField: $.auditDetails.createdTime
      customJsonMapping:
        indexMapping:
          Data: {}
        fieldMapping:
        - inJsonPath: $
          outJsonPath: $.Data

  - topic: egov-persister-deadletter
    configKey: INDEX
    indexes:
      - name: egov-tracer-error-details-persister
        type: general
        id: $.id
        isBulk: false
        timeStampField: $.ts
        customJsonMapping:
          indexMapping: { "Data": { } }
          fieldMapping:
            - inJsonPath: $
              outJsonPath: $.Data
