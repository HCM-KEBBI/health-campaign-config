ServiceMaps:
  serviceName: plan-service
  version: 1.0.0
  mappings:
    - topic: bednet-save-plan
      configKey: INDEX
      indexes:
        - name: bednet-plan-index-v1
          type: general
          id: $.id
          timeStampField: $.auditDetails.createdTime
          jsonPath: $.Plan
          customJsonMapping:
            indexMapping: {"Data":{}}
            fieldMapping:
              - inJsonPath: $
                outJsonPath: $.Data

    - topic: bednet-update-plan
      configKey: INDEX
      indexes:
        - name: bednet-plan-index-v1
          type: general
          id: $.id
          timeStampField: $.auditDetails.createdTime
          jsonPath: $.Plan
          customJsonMapping:
            indexMapping: { "Data": { } }
            fieldMapping:
              - inJsonPath: $
                outJsonPath: $.Data

    - topic: bednet-bulk-update-plan
      configKey: INDEX
      indexes:
        - name: bednet-plan-index-v1
          type: general
          id: $.id
          isBulk: true
          timeStampField: $.auditDetails.createdTime
          jsonPath: $.Plans
          customJsonMapping:
            indexMapping: { "Data": { } }
            fieldMapping:
              - inJsonPath: $
                outJsonPath: $.Data

    - topic: bednet-save-plan-facility
      configKey: INDEX
      indexes:
        - name: bednet-plan-facility-index-v1
          type: general
          id: $.id
          timeStampField: $.auditDetails.createdTime
          jsonPath: $.PlanFacility
          customJsonMapping:
            indexMapping: { "Data": { } }
            fieldMapping:
              - inJsonPath: $
                outJsonPath: $.Data

    - topic: bednet-update-plan-facility
      configKey: INDEX
      indexes:
        - name: bednet-plan-facility-index-v1
          type: general
          id: $.id
          timeStampField: $.auditDetails.createdTime
          jsonPath: $.PlanFacility
          customJsonMapping:
            indexMapping: { "Data": { } }
            fieldMapping:
              - inJsonPath: $
                outJsonPath: $.Data
